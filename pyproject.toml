[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrate-animate-awesome-great"
version = "0.2.0"
description = "Narration-first story to YouTube video pipeline"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1.0"]
veo = ["google-genai>=1.0"]
runway = ["runwayml>=3.0"]
mcp = ["mcp>=2.0.0"]
cloud = ["google-genai>=1.0", "runwayml>=3.0"]
all = ["faster-whisper>=1.1.0", "google-genai>=1.0", "runwayml>=3.0", "mcp>=2.0.0"]
dev = ["pytest>=8.0"]

[project.scripts]
storyforge = "storyforge.cli:main"
storyforge-mcp = "storyforge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
